name: OpenAlea CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  release:
    types:
      - published

jobs:
  build:
    uses: openalea/action-build-publish-anaconda/.github/workflows/openalea_ci.yml@main
    secrets:
      anaconda_token: ${{ secrets.ANACONDA_TOKEN }}

  ci-ok:
    name: CI OK
    needs: build
    if: always()          # run even if build failed/cancelled, otherwise it'd be "skipped" (= passes!)
    runs-on: ubuntu-latest
    steps:
      - name: Check all OpenAlea CI jobs succeeded
        run: |
          echo "build result: ${{ needs.build.result }}"
          [ "${{ needs.build.result }}" = "success" ]

