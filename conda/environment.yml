name: metafspm
channels:
  - openalea3
  - conda-forge
dependencies:
  - python
  - pyyaml
  - numpy
  - numba
  - openalea.mtg
  - scipy
  - pandas
  - pip
  - pytest
  # let pip install the rest using pyproject.toml (if you are okay with conda/pip mix)
  - jsonschema           # openalea.encoding3d's
  - pip:
      - -e ../../encoding3d   # openalea.encoding3d, from the encoding3d clone next to metafspm until it is published
      - -e .."[doc]"
