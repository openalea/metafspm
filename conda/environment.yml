name: metafspm
channels:
  - openalea3
  - conda-forge
dependencies:
  - python
  - pyyaml
  - numpy
  - numba
  - openalea.mtg
  - scipy
  - pandas
  - threadpoolctl
  - openalea.encoding3d  # the encoding3d exchange format (io.encoding3d); until it is published on openalea3, drop this
                         # line and install the clone next to metafspm: pip install -e ../../encoding3d
  - pip
  - pytest
  # let pip install the rest using pyproject.toml (if you are okay with conda/pip mix)
  - pip:
      - -e .."[doc]"
